<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice" fill="none">
  <defs>
    <linearGradient id="bgBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5F8F6"/>
      <stop offset="1" stop-color="#E9F2EE"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E9F7F3"/>
      <stop offset="0.5" stop-color="#B7D9D2"/>
      <stop offset="1" stop-color="#16877E"/>
    </linearGradient>
    <linearGradient id="waveGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#16877E" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#16877E" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#16354C" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="peakGlow" cx="0.75" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#E5A11A" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#E5A11A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base -->
  <rect width="1600" height="800" fill="url(#bgBase)"/>

  <!-- Subtle grid dots -->
  <g fill="#16354C" opacity="0.05">
    <circle cx="80" cy="120" r="2"/><circle cx="160" cy="120" r="2"/><circle cx="240" cy="120" r="2"/><circle cx="320" cy="120" r="2"/><circle cx="400" cy="120" r="2"/><circle cx="480" cy="120" r="2"/><circle cx="560" cy="120" r="2"/><circle cx="640" cy="120" r="2"/><circle cx="720" cy="120" r="2"/><circle cx="800" cy="120" r="2"/><circle cx="880" cy="120" r="2"/><circle cx="960" cy="120" r="2"/><circle cx="1040" cy="120" r="2"/><circle cx="1120" cy="120" r="2"/><circle cx="1200" cy="120" r="2"/><circle cx="1280" cy="120" r="2"/><circle cx="1360" cy="120" r="2"/><circle cx="1440" cy="120" r="2"/><circle cx="1520" cy="120" r="2"/>
    <circle cx="80" cy="200" r="2"/><circle cx="160" cy="200" r="2"/><circle cx="240" cy="200" r="2"/><circle cx="320" cy="200" r="2"/><circle cx="400" cy="200" r="2"/><circle cx="480" cy="200" r="2"/><circle cx="560" cy="200" r="2"/><circle cx="640" cy="200" r="2"/><circle cx="720" cy="200" r="2"/><circle cx="800" cy="200" r="2"/><circle cx="880" cy="200" r="2"/><circle cx="960" cy="200" r="2"/><circle cx="1040" cy="200" r="2"/><circle cx="1120" cy="200" r="2"/><circle cx="1200" cy="200" r="2"/><circle cx="1280" cy="200" r="2"/><circle cx="1360" cy="200" r="2"/><circle cx="1440" cy="200" r="2"/><circle cx="1520" cy="200" r="2"/>
    <circle cx="80" cy="680" r="2"/><circle cx="160" cy="680" r="2"/><circle cx="240" cy="680" r="2"/><circle cx="320" cy="680" r="2"/><circle cx="400" cy="680" r="2"/><circle cx="480" cy="680" r="2"/><circle cx="560" cy="680" r="2"/><circle cx="640" cy="680" r="2"/><circle cx="720" cy="680" r="2"/><circle cx="800" cy="680" r="2"/><circle cx="880" cy="680" r="2"/><circle cx="960" cy="680" r="2"/><circle cx="1040" cy="680" r="2"/><circle cx="1120" cy="680" r="2"/><circle cx="1200" cy="680" r="2"/><circle cx="1280" cy="680" r="2"/><circle cx="1360" cy="680" r="2"/><circle cx="1440" cy="680" r="2"/><circle cx="1520" cy="680" r="2"/>
  </g>

  <!-- Warm peak glow (mid-day expensive hours) -->
  <rect width="1600" height="800" fill="url(#peakGlow)"/>

  <!-- Filled wave area (low band) -->
  <path d="M 0 620
           C 200 580, 350 540, 500 560
           C 650 580, 750 660, 900 640
           C 1050 620, 1200 500, 1400 470
           C 1500 455, 1600 470, 1600 470
           L 1600 800 L 0 800 Z"
        fill="url(#waveGrad)" opacity="0.55"/>

  <!-- Secondary echo wave (lighter, offset) -->
  <path d="M 0 660
           C 200 640, 400 590, 600 610
           C 780 630, 900 700, 1100 680
           C 1280 660, 1400 570, 1600 550
           L 1600 800 L 0 800 Z"
        fill="url(#waveGrad2)" opacity="0.7"/>

  <!-- Foreground curve line (the actual "price curve") -->
  <path d="M 0 500
           C 200 470, 350 430, 500 450
           C 650 470, 750 560, 900 540
           C 1050 520, 1200 380, 1400 350
           C 1500 335, 1600 350, 1600 350"
        stroke="#16877E" stroke-width="2.5" opacity="0.55" fill="none" stroke-linecap="round"/>

  <!-- Node dots along the curve (data points) -->
  <g fill="#16877E">
    <circle cx="200" cy="470" r="4" opacity="0.7"/>
    <circle cx="500" cy="450" r="4" opacity="0.7"/>
    <circle cx="900" cy="540" r="4" opacity="0.7"/>
    <circle cx="1400" cy="350" r="5" opacity="0.9"/>
  </g>
  <!-- Highlighted "cheap" node with soft ring -->
  <circle cx="1400" cy="350" r="14" fill="none" stroke="#16877E" stroke-width="1.5" opacity="0.35"/>
  <circle cx="1400" cy="350" r="22" fill="none" stroke="#16877E" stroke-width="1" opacity="0.18"/>

</svg>
