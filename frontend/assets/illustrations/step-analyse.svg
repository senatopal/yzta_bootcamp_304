<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" in="SourceAlpha"/>
      <feOffset dx="0" dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" in="SourceAlpha"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.20"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tinyShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" in="SourceAlpha"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="centralCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F5F8F6"/>
    </linearGradient>
    <linearGradient id="hubGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1AA294"/>
      <stop offset="1" stop-color="#137068"/>
    </linearGradient>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="300" cy="540" rx="200" ry="14" fill="#16354C" opacity="0.14"/>

  <!-- ============ CONNECTING FLOW LINES (inputs → central hub) ============ -->
  <g stroke="#16877E" stroke-width="2" stroke-dasharray="4 6" fill="none" opacity="0.5" stroke-linecap="round">
    <path d="M 130 170 Q 200 200 260 280"/>
    <path d="M 470 170 Q 400 200 340 280"/>
    <path d="M 90 380 Q 180 380 250 340"/>
  </g>

  <!-- Data flow dots along the lines -->
  <g fill="#16877E">
    <circle cx="180" cy="200" r="3.5"/>
    <circle cx="230" cy="245" r="3"/>
    <circle cx="420" cy="200" r="3.5"/>
    <circle cx="370" cy="245" r="3"/>
    <circle cx="155" cy="378" r="3.5"/>
    <circle cx="220" cy="360" r="3"/>
  </g>

  <!-- ============ INPUT CARD 1: Consumption (top-left) ============ -->
  <g filter="url(#cardShadow)" transform="rotate(-6 130 130)">
    <rect x="50" y="90" width="160" height="90" rx="12" fill="#FFFFFF"/>
    <!-- Label -->
    <rect x="64" y="106" width="60" height="6" rx="2" fill="#16877E"/>
    <!-- Mini bar chart -->
    <g fill="#16877E" opacity="0.85">
      <rect x="64" y="140" width="10" height="24" rx="1"/>
      <rect x="80" y="132" width="10" height="32" rx="1"/>
      <rect x="96" y="126" width="10" height="38" rx="1"/>
      <rect x="112" y="122" width="10" height="42" rx="1"/>
      <rect x="128" y="128" width="10" height="36" rx="1"/>
      <rect x="144" y="136" width="10" height="28" rx="1"/>
      <rect x="160" y="144" width="10" height="20" rx="1"/>
      <rect x="176" y="150" width="10" height="14" rx="1"/>
    </g>
    <!-- kWh badge -->
    <rect x="150" y="102" width="34" height="14" rx="7" fill="#E9F7F3"/>
    <text x="167" y="112" font-family="Arial, sans-serif" font-size="8" font-weight="700" fill="#16877E" text-anchor="middle">kWh</text>
  </g>

  <!-- ============ INPUT CARD 2: Tariff / Price (top-right) ============ -->
  <g filter="url(#cardShadow)" transform="rotate(6 470 130)">
    <rect x="390" y="90" width="160" height="90" rx="12" fill="#FFFFFF"/>
    <!-- Label -->
    <rect x="404" y="106" width="60" height="6" rx="2" fill="#16877E"/>
    <!-- Price curve -->
    <path d="M 404 155
             Q 424 145 444 148
             Q 464 152 480 130
             Q 495 115 512 122
             Q 528 130 540 118"
          stroke="#E5A11A" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Baseline -->
    <line x1="404" y1="164" x2="540" y2="164" stroke="#E9F2EE" stroke-width="1"/>
    <!-- Data points -->
    <circle cx="444" cy="148" r="3" fill="#E5A11A"/>
    <circle cx="512" cy="122" r="3.5" fill="#E5A11A"/>
    <!-- £ badge -->
    <rect x="504" y="102" width="34" height="14" rx="7" fill="#FFF3D9"/>
    <text x="521" y="113" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#C88815" text-anchor="middle">£/h</text>
  </g>

  <!-- ============ INPUT CARD 3: Forecast (lower-left) ============ -->
  <g filter="url(#cardShadow)" transform="rotate(4 90 380)">
    <rect x="20" y="345" width="150" height="70" rx="12" fill="#FFFFFF"/>
    <!-- Label -->
    <rect x="34" y="360" width="50" height="6" rx="2" fill="#16877E"/>
    <!-- Weather / forecast icon -->
    <circle cx="52" cy="392" r="10" fill="#E5A11A"/>
    <path d="M 68 396
             Q 78 384 92 388
             Q 106 385 112 396
             Q 122 395 124 404
             Q 122 410 112 410
             L 76 410
             Q 66 410 68 396 Z"
          fill="#B7D9D2"/>
    <!-- Forecast trend line -->
    <path d="M 130 400 L 138 388 L 150 394 L 158 384"
          stroke="#16877E" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ============ CENTRAL DASHBOARD / HUB ============ -->
  <g filter="url(#softShadow)">
    <!-- Main card -->
    <rect x="200" y="245" width="240" height="220" rx="20" fill="url(#centralCard)"/>

    <!-- Header bar -->
    <rect x="200" y="245" width="240" height="34" rx="20" fill="#16354C"/>
    <rect x="200" y="265" width="240" height="14" fill="#16354C"/>
    <circle cx="220" cy="262" r="5" fill="#16877E"/>
    <circle cx="220" cy="262" r="2" fill="#E9F7F3"/>
    <rect x="234" y="258" width="80" height="7" rx="3" fill="#E9F7F3"/>

    <!-- Central big chart: usage vs price overlay -->
    <!-- baseline grid -->
    <line x1="220" y1="380" x2="420" y2="380" stroke="#E9F2EE" stroke-width="1"/>
    <line x1="220" y1="345" x2="420" y2="345" stroke="#E9F2EE" stroke-width="1"/>
    <line x1="220" y1="310" x2="420" y2="310" stroke="#E9F2EE" stroke-width="1"/>

    <!-- Consumption bars (teal) -->
    <g fill="#16877E" opacity="0.75">
      <rect x="228" y="352" width="12" height="28" rx="2"/>
      <rect x="248" y="345" width="12" height="35" rx="2"/>
      <rect x="268" y="335" width="12" height="45" rx="2"/>
      <rect x="288" y="330" width="12" height="50" rx="2"/>
      <rect x="308" y="338" width="12" height="42" rx="2"/>
      <rect x="328" y="350" width="12" height="30" rx="2"/>
      <rect x="348" y="358" width="12" height="22" rx="2"/>
      <rect x="368" y="352" width="12" height="28" rx="2"/>
      <rect x="388" y="345" width="12" height="35" rx="2"/>
      <rect x="408" y="360" width="12" height="20" rx="2"/>
    </g>

    <!-- Price curve overlay (yellow) -->
    <path d="M 234 340
             Q 260 320 290 305
             Q 320 300 350 315
             Q 380 330 415 320"
          stroke="#E5A11A" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Highlighted "insight" point (where high usage meets high price) -->
    <circle cx="294" cy="305" r="10" fill="none" stroke="#E5A11A" stroke-width="2" opacity="0.5"/>
    <circle cx="294" cy="305" r="16" fill="none" stroke="#E5A11A" stroke-width="1.5" opacity="0.3"/>
    <circle cx="294" cy="305" r="5" fill="#E5A11A"/>

    <!-- Bottom stats row -->
    <rect x="220" y="400" width="60" height="10" rx="2" fill="#16877E" opacity="0.7"/>
    <rect x="220" y="418" width="90" height="6" rx="2" fill="#16354C" opacity="0.4"/>

    <rect x="330" y="400" width="60" height="10" rx="2" fill="#E5A11A" opacity="0.85"/>
    <rect x="330" y="418" width="90" height="6" rx="2" fill="#16354C" opacity="0.4"/>

    <!-- Small legend dots -->
    <circle cx="226" cy="440" r="4" fill="#16877E"/>
    <rect x="235" y="437" width="50" height="5" rx="2" fill="#16354C" opacity="0.5"/>
    <circle cx="300" cy="440" r="4" fill="#E5A11A"/>
    <rect x="309" y="437" width="50" height="5" rx="2" fill="#16354C" opacity="0.5"/>
  </g>

  <!-- ============ INSIGHT BADGE (floating on the central card) ============ -->
  <g filter="url(#tinyShadow)" transform="rotate(-8 460 300)">
    <rect x="410" y="278" width="98" height="42" rx="10" fill="#16354C"/>
    <path d="M 425 292
             L 418 306
             L 424 306
             L 421 314
             L 431 302
             L 425 302
             L 428 292 Z"
          fill="#E5A11A"/>
    <rect x="440" y="288" width="58" height="6" rx="2" fill="#E9F7F3"/>
    <rect x="440" y="300" width="42" height="6" rx="2" fill="#16877E"/>
    <rect x="440" y="310" width="34" height="4" rx="2" fill="#E9F7F3" opacity="0.6"/>
  </g>

</svg>
