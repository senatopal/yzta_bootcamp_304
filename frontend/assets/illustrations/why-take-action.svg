<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <filter id="phoneShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" in="SourceAlpha"/>
      <feOffset dx="6" dy="14"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" in="SourceAlpha"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.20"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="phoneBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F4B68"/>
      <stop offset="1" stop-color="#16354C"/>
    </linearGradient>
    <linearGradient id="screenBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5F8F6"/>
      <stop offset="1" stop-color="#E9F2EE"/>
    </linearGradient>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="300" cy="555" rx="180" ry="12" fill="#16354C" opacity="0.16"/>

  <!-- ============ PHONE (slight three-quarter tilt) ============ -->
  <g filter="url(#phoneShadow)" transform="rotate(-6 300 300)">
    <!-- Outer body -->
    <rect x="170" y="60" width="260" height="500" rx="38" fill="url(#phoneBody)"/>
    <!-- Inner bezel -->
    <rect x="180" y="70" width="240" height="480" rx="30" fill="#0E2438"/>
    <!-- Screen -->
    <rect x="188" y="78" width="224" height="464" rx="24" fill="url(#screenBg)"/>

    <!-- Status bar -->
    <rect x="204" y="98" width="30" height="4" rx="2" fill="#16354C" opacity="0.7"/>
    <g fill="#16354C" opacity="0.65">
      <rect x="360" y="97" width="16" height="6" rx="1"/>
      <rect x="384" y="97" width="4" height="6" rx="1"/>
      <rect x="392" y="97" width="4" height="6" rx="1"/>
      <rect x="400" y="97" width="4" height="6" rx="1"/>
    </g>

    <!-- App header -->
    <circle cx="212" cy="130" r="8" fill="#16877E"/>
    <rect x="228" y="126" width="46" height="8" rx="3" fill="#16354C"/>

    <!-- Section label -->
    <rect x="204" y="160" width="120" height="9" rx="3" fill="#16877E" opacity="0.85"/>

    <!-- Main recommendation card -->
    <g filter="url(#cardShadow)">
      <rect x="204" y="185" width="200" height="240" rx="16" fill="#FFFFFF"/>
      <!-- Small header -->
      <rect x="220" y="205" width="80" height="7" rx="3" fill="#16877E"/>
      <!-- Big title lines -->
      <rect x="220" y="225" width="150" height="12" rx="3" fill="#16354C"/>
      <rect x="220" y="243" width="120" height="12" rx="3" fill="#16354C"/>
      <!-- Time badge -->
      <rect x="220" y="266" width="80" height="14" rx="7" fill="#E9F7F3"/>
      <rect x="230" y="270" width="60" height="6" rx="3" fill="#16877E"/>

      <!-- Divider -->
      <line x1="220" y1="298" x2="388" y2="298" stroke="#E9F2EE" stroke-width="1.5"/>

      <!-- Estimated saving label -->
      <rect x="220" y="312" width="70" height="7" rx="3" fill="#16354C" opacity="0.55"/>
      <!-- Big £ amount -->
      <text x="220" y="360" font-family="Arial Black, sans-serif" font-size="38" font-weight="900" fill="#16877E">£1.20</text>

      <!-- Bottom tag row -->
      <circle cx="228" cy="395" r="4" fill="#16877E"/>
      <rect x="238" y="391" width="130" height="7" rx="3" fill="#16354C" opacity="0.55"/>
    </g>

    <!-- Below-card row -->
    <rect x="204" y="440" width="90" height="8" rx="3" fill="#16354C" opacity="0.4"/>
    <rect x="204" y="456" width="140" height="8" rx="3" fill="#16354C" opacity="0.25"/>

    <!-- Home indicator bar -->
    <rect x="264" y="520" width="72" height="4" rx="2" fill="#16354C" opacity="0.5"/>

    <!-- Side button -->
    <rect x="167" y="180" width="4" height="46" rx="2" fill="#0E2438"/>
    <rect x="167" y="240" width="4" height="30" rx="2" fill="#0E2438"/>
  </g>

  <!-- Lightning notification ping floating above phone -->
  <g filter="url(#cardShadow)">
    <circle cx="440" cy="130" r="34" fill="#E5A11A"/>
    <path d="M 440 108
             L 425 138
             L 438 138
             L 432 158
             L 452 128
             L 440 128
             L 445 108 Z"
          fill="#FFFFFF"/>
  </g>

  <!-- Small check tag near bottom -->
  <g filter="url(#cardShadow)">
    <circle cx="150" cy="470" r="26" fill="#16877E"/>
    <path d="M 138 470 L 147 480 L 163 462"
          stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

</svg>
