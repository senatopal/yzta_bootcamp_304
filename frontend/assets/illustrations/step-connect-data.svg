<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" in="SourceAlpha"/>
      <feOffset dx="4" dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tinyShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" in="SourceAlpha"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="meterBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DDECE7"/>
    </linearGradient>
    <linearGradient id="meterSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1AA294"/>
      <stop offset="1" stop-color="#16877E"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F4B68"/>
      <stop offset="1" stop-color="#16354C"/>
    </linearGradient>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="270" cy="530" rx="180" ry="12" fill="#16354C" opacity="0.16"/>

  <!-- ============ WIRELESS SIGNAL WAVES (top-right) ============ -->
  <g stroke="#16877E" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M 380 210 Q 400 200 420 210" opacity="0.9"/>
    <path d="M 375 190 Q 405 172 435 190" opacity="0.65"/>
    <path d="M 370 168 Q 407 140 445 168" opacity="0.4"/>
  </g>
  <!-- Signal source dot -->
  <circle cx="400" cy="215" r="5" fill="#16877E"/>

  <!-- ============ WALL PLATE ============ -->
  <circle cx="260" cy="310" r="200" fill="#E9F7F3"/>
  <circle cx="260" cy="310" r="200" fill="none" stroke="#16877E" stroke-width="1.5" opacity="0.2"/>

  <!-- ============ SMART METER (three-quarter) ============ -->
  <g filter="url(#softShadow)">
    <!-- Right side (teal) -->
    <path d="M 355 195
             L 395 175
             L 395 435
             L 355 455 Z"
          fill="url(#meterSide)"/>
    <!-- Top face -->
    <path d="M 130 195
             L 170 175
             L 395 175
             L 355 195 Z"
          fill="url(#meterBody)"/>
    <path d="M 172 178 L 393 178" stroke="#FFFFFF" stroke-width="2" opacity="0.9"/>

    <!-- Front face -->
    <rect x="130" y="195" width="225" height="260" fill="url(#meterBody)"/>
    <rect x="130" y="195" width="10" height="260" fill="#EEF3F1" opacity="0.7"/>
    <rect x="345" y="195" width="10" height="260" fill="#D9E4DF" opacity="0.7"/>
  </g>

  <!-- Brand strip on top -->
  <rect x="145" y="207" width="200" height="20" rx="4" fill="#16354C"/>
  <circle cx="158" cy="217" r="3.5" fill="#16877E"/>
  <rect x="170" y="214" width="40" height="6" rx="2" fill="#E9F7F3"/>

  <!-- Digital display -->
  <rect x="152" y="245" width="180" height="90" rx="8" fill="url(#screenGrad)"/>
  <rect x="152" y="245" width="180" height="8" rx="4" fill="#0E2438" opacity="0.8"/>

  <!-- Screen content: kWh reading -->
  <text x="242" y="290" font-family="Arial Black, sans-serif" font-size="26" font-weight="900" fill="#E9F7F3" text-anchor="middle">2.4</text>
  <text x="304" y="290" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#16877E">kWh</text>

  <!-- Mini live bar chart on screen -->
  <g fill="#16877E">
    <rect x="164" y="315" width="6" height="10" rx="1"/>
    <rect x="174" y="311" width="6" height="14" rx="1"/>
    <rect x="184" y="308" width="6" height="17" rx="1"/>
    <rect x="194" y="305" width="6" height="20" rx="1" fill="#E5A11A"/>
    <rect x="204" y="310" width="6" height="15" rx="1"/>
    <rect x="214" y="316" width="6" height="9" rx="1"/>
    <rect x="224" y="313" width="6" height="12" rx="1"/>
    <rect x="234" y="317" width="6" height="8" rx="1"/>
    <rect x="244" y="312" width="6" height="13" rx="1"/>
    <rect x="254" y="315" width="6" height="10" rx="1"/>
    <rect x="264" y="318" width="6" height="7" rx="1"/>
    <rect x="274" y="320" width="6" height="5" rx="1"/>
    <rect x="284" y="318" width="6" height="7" rx="1"/>
    <rect x="294" y="316" width="6" height="9" rx="1"/>
    <rect x="304" y="319" width="6" height="6" rx="1"/>
    <rect x="314" y="321" width="6" height="4" rx="1"/>
  </g>

  <!-- Screen live indicator dot (top-right of screen) -->
  <circle cx="322" cy="258" r="3" fill="#16877E"/>

  <!-- Row of status LEDs below screen -->
  <circle cx="170" cy="360" r="5" fill="#16877E"/>
  <circle cx="170" cy="360" r="2" fill="#E9F7F3"/>
  <rect x="185" y="356" width="30" height="8" rx="2" fill="#E5A11A"/>
  <rect x="222" y="356" width="30" height="8" rx="2" fill="#16877E" opacity="0.4"/>

  <!-- Bottom info area -->
  <rect x="152" y="385" width="180" height="52" rx="8" fill="#F2F5F3"/>
  <rect x="164" y="398" width="70" height="6" rx="2" fill="#16354C" opacity="0.55"/>
  <rect x="164" y="412" width="120" height="6" rx="2" fill="#16354C" opacity="0.35"/>
  <rect x="164" y="424" width="90" height="6" rx="2" fill="#16354C" opacity="0.35"/>

  <!-- ============ DATA STREAM (flowing from meter toward signal source) ============ -->
  <g fill="#16877E">
    <circle cx="360" cy="270" r="5" opacity="0.85"/>
    <circle cx="378" cy="256" r="4" opacity="0.7"/>
    <circle cx="394" cy="242" r="3" opacity="0.55"/>
    <circle cx="400" cy="228" r="2.5" opacity="0.45"/>
  </g>

  <!-- ============ FLOATING SMALL DEVICE (cloud/phone receiving data, upper-right) ============ -->
  <g filter="url(#tinyShadow)">
    <rect x="440" y="150" width="90" height="65" rx="14" fill="#16354C"/>
    <rect x="446" y="156" width="78" height="53" rx="10" fill="#E9F7F3"/>
    <!-- Received chart lines -->
    <path d="M 452 195 L 460 185 L 470 190 L 482 176 L 494 182 L 508 168 L 520 172"
          stroke="#16877E" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Data points -->
    <circle cx="460" cy="185" r="2.5" fill="#16877E"/>
    <circle cx="482" cy="176" r="2.5" fill="#16877E"/>
    <circle cx="508" cy="168" r="2.5" fill="#E5A11A"/>
  </g>

  <!-- Feet -->
  <rect x="150" y="455" width="24" height="14" rx="3" fill="#16354C"/>
  <rect x="311" y="455" width="24" height="14" rx="3" fill="#16354C"/>

</svg>
