<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" fill="none">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" in="SourceAlpha"/>
      <feOffset dx="6" dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.20"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tinyShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" in="SourceAlpha"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="sideMint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9F7F3"/>
      <stop offset="1" stop-color="#C6E1D9"/>
    </linearGradient>
    <linearGradient id="topGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E7EDEA"/>
    </linearGradient>
    <linearGradient id="interiorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16877E"/>
      <stop offset="1" stop-color="#0E6A62"/>
    </linearGradient>
    <linearGradient id="doorInside" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9F7F3"/>
      <stop offset="1" stop-color="#B7D9D2"/>
    </linearGradient>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="440" cy="745" rx="290" ry="14" fill="#16354C" opacity="0.14"/>

  <!-- ============ CABINET BODY ============ -->
  <g filter="url(#softShadow)">
    <!-- Right side (mint) -->
    <path d="M 620 165
             L 700 130
             L 700 690
             L 620 725 Z"
          fill="url(#sideMint)"/>
    <!-- Top face -->
    <path d="M 180 165
             L 260 130
             L 700 130
             L 620 165 Z"
          fill="url(#topGrad)"/>
    <path d="M 262 133 L 696 133" stroke="#FFFFFF" stroke-width="2" opacity="0.9"/>

    <!-- Front face (white) -->
    <rect x="180" y="165" width="440" height="560" fill="#FFFFFF"/>
    <!-- Left edge subtle shading -->
    <rect x="180" y="165" width="12" height="560" fill="#EEF3F1" opacity="0.7"/>
    <!-- Bottom kick plate -->
    <path d="M 180 706 L 620 706 L 620 725 L 180 725 Z" fill="#F2F5F3"/>
    <path d="M 620 706 L 700 671 L 700 690 L 620 725 Z" fill="#B7D9D2"/>
  </g>

  <!-- ============ CONTROL PANEL ============ -->
  <g>
    <rect x="192" y="182" width="416" height="58" rx="6" fill="#16354C"/>
    <rect x="192" y="182" width="416" height="5" rx="2.5" fill="#1F4B68"/>

    <!-- Left LEDs -->
    <rect x="216" y="204" width="26" height="10" rx="3" fill="#16877E"/>
    <rect x="252" y="204" width="26" height="10" rx="3" fill="#16877E"/>

    <!-- Digital display -->
    <rect x="428" y="197" width="60" height="26" rx="4" fill="#0E2438"/>
    <circle cx="440" cy="210" r="2.5" fill="#16877E"/>
    <circle cx="450" cy="210" r="2.5" fill="#16877E"/>
    <circle cx="460" cy="210" r="2.5" fill="#16877E" opacity="0.4"/>

    <!-- Dial -->
    <g filter="url(#tinyShadow)">
      <circle cx="530" cy="211" r="22" fill="#FFFFFF"/>
      <circle cx="530" cy="211" r="22" fill="none" stroke="#D9E4DF" stroke-width="1.5"/>
      <circle cx="530" cy="211" r="16" fill="#16354C"/>
      <path d="M 530 198 L 534 213 L 526 213 Z" fill="#E9F7F3"/>
      <circle cx="530" cy="211" r="3" fill="#1F4B68"/>
    </g>

    <!-- Yellow indicator -->
    <rect x="568" y="205" width="14" height="10" rx="2" fill="#E5A11A"/>
  </g>

  <!-- ============ DOOR OPENING (interior teal cavity) ============ -->
  <path d="M 215 250
           L 600 250
           L 600 620
           L 215 620 Z"
        fill="url(#interiorGrad)"/>
  <!-- Interior side highlight -->
  <path d="M 215 250 L 225 250 L 225 620 L 215 620 Z" fill="#0E6A62"/>
  <!-- Interior back panel subtle vertical shading -->
  <path d="M 215 610 L 600 610 L 600 620 L 215 620 Z" fill="#0E6A62"/>

  <!-- ============ UPPER RACK (cups / glasses) ============ -->
  <g>
    <!-- Rack frame -->
    <rect x="240" y="300" width="335" height="120" rx="6" fill="none" stroke="#E9F7F3" stroke-width="3.5"/>
    <!-- Rack tines vertical -->
    <g stroke="#E9F7F3" stroke-width="2" opacity="0.85">
      <line x1="270" y1="300" x2="270" y2="420"/>
      <line x1="300" y1="300" x2="300" y2="420"/>
      <line x1="330" y1="300" x2="330" y2="420"/>
      <line x1="360" y1="300" x2="360" y2="420"/>
      <line x1="390" y1="300" x2="390" y2="420"/>
      <line x1="420" y1="300" x2="420" y2="420"/>
      <line x1="450" y1="300" x2="450" y2="420"/>
      <line x1="480" y1="300" x2="480" y2="420"/>
      <line x1="510" y1="300" x2="510" y2="420"/>
      <line x1="540" y1="300" x2="540" y2="420"/>
    </g>

    <!-- Cups (upside down) -->
    <g>
      <!-- cup 1 -->
      <path d="M 275 340 L 275 400 Q 275 410 285 410 L 315 410 Q 325 410 325 400 L 325 340 Z" fill="#FFFFFF"/>
      <ellipse cx="300" cy="340" rx="25" ry="6" fill="#E9F7F3"/>
      <!-- cup 2 -->
      <path d="M 335 340 L 335 400 Q 335 410 345 410 L 375 410 Q 385 410 385 400 L 385 340 Z" fill="#FFFFFF"/>
      <ellipse cx="360" cy="340" rx="25" ry="6" fill="#E9F7F3"/>
      <!-- cup 3 -->
      <path d="M 395 340 L 395 400 Q 395 410 405 410 L 435 410 Q 445 410 445 400 L 445 340 Z" fill="#FFFFFF"/>
      <ellipse cx="420" cy="340" rx="25" ry="6" fill="#E9F7F3"/>
      <!-- cup 4 -->
      <path d="M 455 340 L 455 400 Q 455 410 465 410 L 495 410 Q 505 410 505 400 L 505 340 Z" fill="#FFFFFF"/>
      <ellipse cx="480" cy="340" rx="25" ry="6" fill="#E9F7F3"/>
      <!-- cup 5 -->
      <path d="M 515 340 L 515 400 Q 515 410 525 410 L 555 410 Q 565 410 565 400 L 565 340 Z" fill="#FFFFFF"/>
      <ellipse cx="540" cy="340" rx="25" ry="6" fill="#E9F7F3"/>
    </g>
  </g>

  <!-- ============ LOWER RACK (plates + cutlery basket) ============ -->
  <g>
    <!-- Rack frame -->
    <rect x="230" y="470" width="355" height="130" rx="6" fill="none" stroke="#E9F7F3" stroke-width="3.5"/>
    <!-- Vertical tines -->
    <g stroke="#E9F7F3" stroke-width="2" opacity="0.85">
      <line x1="260" y1="470" x2="260" y2="600"/>
      <line x1="285" y1="470" x2="285" y2="600"/>
      <line x1="310" y1="470" x2="310" y2="600"/>
      <line x1="335" y1="470" x2="335" y2="600"/>
      <line x1="360" y1="470" x2="360" y2="600"/>
      <line x1="385" y1="470" x2="385" y2="600"/>
      <line x1="410" y1="470" x2="410" y2="600"/>
      <line x1="435" y1="470" x2="435" y2="600"/>
      <line x1="460" y1="470" x2="460" y2="600"/>
    </g>

    <!-- Plates (standing) -->
    <g>
      <ellipse cx="272" cy="530" rx="15" ry="55" fill="#FFFFFF"/>
      <ellipse cx="272" cy="530" rx="8" ry="52" fill="#E9F7F3"/>
      <ellipse cx="300" cy="530" rx="15" ry="55" fill="#FFFFFF"/>
      <ellipse cx="300" cy="530" rx="8" ry="52" fill="#E9F7F3"/>
      <ellipse cx="328" cy="530" rx="15" ry="55" fill="#FFFFFF"/>
      <ellipse cx="328" cy="530" rx="8" ry="52" fill="#E9F7F3"/>
      <ellipse cx="356" cy="530" rx="15" ry="55" fill="#FFFFFF"/>
      <ellipse cx="356" cy="530" rx="8" ry="52" fill="#E9F7F3"/>
      <ellipse cx="384" cy="530" rx="15" ry="55" fill="#FFFFFF"/>
      <ellipse cx="384" cy="530" rx="8" ry="52" fill="#E9F7F3"/>
      <ellipse cx="412" cy="530" rx="15" ry="55" fill="#FFFFFF"/>
      <ellipse cx="412" cy="530" rx="8" ry="52" fill="#E9F7F3"/>
    </g>

    <!-- Cutlery basket (teal) -->
    <g>
      <rect x="475" y="490" width="95" height="100" rx="6" fill="#16877E"/>
      <rect x="475" y="490" width="95" height="10" rx="4" fill="#1AA294"/>
      <!-- Basket grid pattern -->
      <g fill="#0E6A62" opacity="0.7">
        <rect x="483" y="510" width="6" height="6" rx="1"/>
        <rect x="495" y="510" width="6" height="6" rx="1"/>
        <rect x="507" y="510" width="6" height="6" rx="1"/>
        <rect x="519" y="510" width="6" height="6" rx="1"/>
        <rect x="531" y="510" width="6" height="6" rx="1"/>
        <rect x="543" y="510" width="6" height="6" rx="1"/>
        <rect x="555" y="510" width="6" height="6" rx="1"/>
        <rect x="483" y="524" width="6" height="6" rx="1"/>
        <rect x="495" y="524" width="6" height="6" rx="1"/>
        <rect x="507" y="524" width="6" height="6" rx="1"/>
        <rect x="519" y="524" width="6" height="6" rx="1"/>
        <rect x="531" y="524" width="6" height="6" rx="1"/>
        <rect x="543" y="524" width="6" height="6" rx="1"/>
        <rect x="555" y="524" width="6" height="6" rx="1"/>
        <rect x="483" y="538" width="6" height="6" rx="1"/>
        <rect x="495" y="538" width="6" height="6" rx="1"/>
        <rect x="507" y="538" width="6" height="6" rx="1"/>
        <rect x="519" y="538" width="6" height="6" rx="1"/>
        <rect x="531" y="538" width="6" height="6" rx="1"/>
        <rect x="543" y="538" width="6" height="6" rx="1"/>
        <rect x="555" y="538" width="6" height="6" rx="1"/>
        <rect x="483" y="552" width="6" height="6" rx="1"/>
        <rect x="495" y="552" width="6" height="6" rx="1"/>
        <rect x="507" y="552" width="6" height="6" rx="1"/>
        <rect x="519" y="552" width="6" height="6" rx="1"/>
        <rect x="531" y="552" width="6" height="6" rx="1"/>
        <rect x="543" y="552" width="6" height="6" rx="1"/>
        <rect x="555" y="552" width="6" height="6" rx="1"/>
        <rect x="483" y="566" width="6" height="6" rx="1"/>
        <rect x="495" y="566" width="6" height="6" rx="1"/>
        <rect x="507" y="566" width="6" height="6" rx="1"/>
        <rect x="519" y="566" width="6" height="6" rx="1"/>
        <rect x="531" y="566" width="6" height="6" rx="1"/>
        <rect x="543" y="566" width="6" height="6" rx="1"/>
        <rect x="555" y="566" width="6" height="6" rx="1"/>
      </g>
      <!-- Cutlery sticking out -->
      <g>
        <rect x="488" y="470" width="6" height="30" rx="2" fill="#E9F7F3"/>
        <ellipse cx="491" cy="472" rx="7" ry="4" fill="#E9F7F3"/>
        <rect x="504" y="470" width="6" height="30" rx="2" fill="#E9F7F3"/>
        <path d="M 501 470 L 507 460 L 513 470 Z" fill="#E9F7F3"/>
        <rect x="520" y="470" width="6" height="30" rx="2" fill="#E9F7F3"/>
        <ellipse cx="523" cy="472" rx="7" ry="4" fill="#E9F7F3"/>
        <rect x="536" y="470" width="6" height="30" rx="2" fill="#E9F7F3"/>
        <path d="M 533 470 L 539 460 L 545 470 Z" fill="#E9F7F3"/>
        <rect x="552" y="470" width="6" height="30" rx="2" fill="#E9F7F3"/>
        <ellipse cx="555" cy="472" rx="7" ry="4" fill="#E9F7F3"/>
      </g>
    </g>
  </g>

  <!-- ============ OPEN DOOR (angled forward/down) ============ -->
  <g filter="url(#softShadow)">
    <!-- Door top face (inside of door) -->
    <path d="M 200 620
             L 615 620
             L 655 700
             L 155 700 Z"
          fill="url(#doorInside)"/>
    <!-- Door front lip -->
    <path d="M 155 700 L 655 700 L 655 715 L 155 715 Z" fill="#FFFFFF"/>
    <!-- Door edge/bottom navy strip (matches original) -->
    <path d="M 155 715 L 655 715 L 655 728 L 155 728 Z" fill="#16354C"/>
    <!-- Handle indent -->
    <rect x="380" y="682" width="60" height="8" rx="4" fill="#B7D9D2"/>
  </g>

  <!-- ============ FEET ============ -->
  <rect x="195" y="725" width="26" height="16" rx="4" fill="#16354C"/>
  <rect x="580" y="725" width="26" height="16" rx="4" fill="#16354C"/>
  <path d="M 650 700 L 690 682 L 690 700 L 650 718 Z" fill="#16354C"/>

</svg>
